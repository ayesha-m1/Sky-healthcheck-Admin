<!DOCTYPE html>
<html lang="en">
<head>
    {% load static %}
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sky Life - Health Check System</title>
    <link rel="stylesheet" href="{% static 'dashboard/css/style.css' %}">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
     body {
    background-color: #f8f9fa !important;
    margin-top: 5px !important;
}

.top-gradient {
    height: 3px;
    background: linear-gradient(to right, #ff5757, #ff914d, #ffcd4d, #5aa9e6, #7768ae);
    width: 100%;
}

.header-container {
background-color: white;
padding: 0;
margin: 0;
width: 100%; 
}

.sky-logo {

line-height: 0.9;
padding: 15px 0 15px 20px;
}

.sky-text {
font-size: 52px !important;
font-weight: bold;
background: linear-gradient(to right, #ff5757, #ff914d, #ffcd4d, #5aa9e6, #7768ae);
background-clip: text;
-webkit-background-clip: text;
-webkit-text-fill-color: transparent;
color: transparent; 
display: inline-block;
}

.life-text {
font-size: 42px;
color: #6c757d; 
font-weight: 600;
letter-spacing: 2px;
margin-left: 4rem;
}

.nav-bar {
background-color: #B1B2C2;
padding: 8px 15px; 
margin: 0;

}

.nav-bar a {
    color: white;
    text-decoration: none;
    padding: 0 10px;
}

.page-container {
    background-color: white;
   
    padding: 20px;
    box-shadow: 0 0 10px rgba(0,0,0,0.1);
    margin-top: 5px;
}

.sidebar-bg {
    background: linear-gradient(135deg, #ffa07a, #87ceeb);
    min-height: 100%;
}

.navigation-buttons {
    margin-top: 30px;
}
    </style>
</head>
<body>
    <div class="container-fluid p-0">
      
      
           
            <div class="container">
                <div class="top-gradient"></div> 
                <div class="header-container">
                    <div class="sky-logo">
                        <img src="/static/Sky_Logo.png" style="height: 80px; width: 120px;" alt="Sky Life Logo">
                        
                    </div>
                </div>
            </div>
    
        
        <div class="container-fluid p-0">
            <div class="container"> 
                <div class="nav-bar">
                    <div class="d-flex justify-content-between">
                        <div>
                            <a href="{% url 'welcome' %}">Home</a>
                        </div>
                        <div>
                            <a href="#">Profile</a>
                            <a href="#" class="ms-3">Log out</a>
                        </div>
                    </div>
                </div>
            </div>
            
            <div class="container">
                <div class="page-container">
                    <div class="row">
                        <div class="col-md-1 sidebar-bg"></div>
                        <div class="col-md-10">
                            {% block content %}{% endblock %}
                            
                            <div class="navigation-buttons text-center">
                                {% block navigation_buttons %}{% endblock %}
                            </div>
                        </div>
                        <div class="col-md-1 sidebar-bg"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
