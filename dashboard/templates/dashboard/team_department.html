{% extends 'dashboard/main.html' %}
{% block content %}
<div class="row" style="display: flex; align-items: center; justify-content: center;">
  <!-- Left Panel -->
  <div class="col-md-6 mb-4">
    <!-- Dropdown Select -->
    <div class="mb-3">
      <select class="form-select" id="teamSelect" aria-label="Team selection" style="border-radius: 0;">
        <option selected>Select The Team You Are Wanting To View</option>
        <option value="T1">T1</option>
        <option value="T2">T2</option>
        <option value="T3">T3</option>
        <option value="T4">T4</option>
        <option value="T5">T5</option>
        <option value="T6">T6</option>
      </select>
    </div>

    <!-- Team Box -->
    <div style="border: 1px solid #ccc; padding: 8px; min-height: 80px">
      <div
        style="
          display: flex;
          flex-direction: column;
          align-items: center;
          justify-content: center;
          min-height: 50vh;
          padding: 10px;
        "
      >
        <!-- Team Section -->
        <div id="teamInfo"
          style="
            border: 1px solid #ccc;
            padding: 8px;
            text-align: center;
            margin-bottom: 8px;
            width: 200px;
          "
        >
          <strong id="departmentName">Select a team to view department</strong><br />
          <small id="teamName"></small>
        </div>

        <!-- Users Section - Initially Empty -->
        <div id="usersSection"
          style="
            border: 1px solid #ccc;
            padding: 15px;
            text-align: center;
            width: 200px;
            min-height: 120px;
          "
        >
          <!-- Content will be added dynamically -->
        </div>
      </div>
    </div>

    <!-- Buttons -->
    <div class="d-flex justify-content-center mt-2">
      <button
        class="btn btn-light mx-1"
        style="width: 80px; border: 1px solid #ccc"
      >
        Add
      </button>
      <button
        class="btn btn-light mx-1"
        style="width: 80px; border: 1px solid #ccc"
      >
        Delete
      </button>
    </div>
  </div>
</div>

<script>
  // Sample user data for each team
  const teamUsers = {
    'T1': ['user a','user b', 'user c','user d','user e'],
    'T2': ['user a','user b', 'user c','user d','user e'],
    'T3': ['user a','user b', 'user c','user d','user e'],
    'T4': ['user a','user b', 'user c','user d','user e'],
    'T5': ['user a','user b', 'user c','user d','user e'],
    'T6': ['user a','user b', 'user c','user d','user e']
  };

  document.getElementById('teamSelect').addEventListener('change', function() {
    const selectedTeam = this.value;
    const departmentElement = document.getElementById('departmentName');
    const teamNameElement = document.getElementById('teamName');
    const usersSection = document.getElementById('usersSection');
    
    // Clear previous content
    usersSection.innerHTML = '';
    
    if (selectedTeam === 'Select The Team You Are Wanting To View') {
      departmentElement.textContent = 'Select a team to view department';
      teamNameElement.textContent = '';
      return;
    }
    
    if (['T1', 'T2', 'T3'].includes(selectedTeam)) {
      departmentElement.textContent = 'Department Sky Design';
      teamNameElement.textContent = 'Team ' + selectedTeam.substring(1);
    } 
    else if (['T4', 'T5', 'T6'].includes(selectedTeam)) {
      departmentElement.textContent = 'Department Sky Creation';
      teamNameElement.textContent = 'Team ' + selectedTeam.substring(1);
    }
    
    // Populate users section
    if (teamUsers[selectedTeam]) {
      teamUsers[selectedTeam].forEach(user => {
        const userElement = document.createElement('div');
        userElement.textContent = user;
        usersSection.appendChild(userElement);
      });
    }
  });
</script>
{% endblock %}

{% block navigation_buttons %}
<div class="mt-5">
  <a href="{% url 'welcome' %}" class="btn btn-primary">Back</a>
  <a href="{% url 'view_user' %}" class="btn btn-primary">Next</a>
</div>
{% endblock %}
